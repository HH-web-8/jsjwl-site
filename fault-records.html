<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复杂故障记录平台 | 光纤熔接实训</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f9ff;color:#1e293b;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px;position:relative}
a{text-decoration:none}

/* 顶部导航 */
.nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{color:#2563eb;font-size:14px}
.back:hover{text-decoration:underline}
.nav .sp{flex:1}

/* 标题区 */
.hd{text-align:center;padding:24px 0 16px;border-bottom:1px solid #e2e8f0}
.hd h1{font-size:26px;color:#1e293b;margin-bottom:6px}
.hd p{color:#64748b;font-size:14px}
.hd .tag{display:inline-block;background:#dbeafe;color:#2563eb;padding:4px 14px;border-radius:12px;font-size:12px;margin-top:10px;border:1px solid #bfdbfe}

/* 统计面板 */
.stats{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;text-align:center}
.stat .v{font-size:28px;font-weight:700;color:#2563eb}
.stat .l{font-size:12px;color:#64748b;margin-top:4px}

/* 搜索+筛选 */
.toolbar{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px 10px 36px;color:#1e293b;font-size:14px;outline:none}
.search input:focus{border-color:#2563eb}
.search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.5}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:#fff;border:1px solid #e2e8f0;color:#64748b;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .2s}
.fbtn:hover{border-color:#2563eb;color:#1e293b}
.fbtn.on{background:#dbeafe;border-color:#2563eb;color:#2563eb}
.add-btn{background:#2563eb;border:1px solid #2563eb;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.add-btn:hover{background:#1d4ed8}

/* 故障卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;margin-top:18px}
.fc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;transition:all .3s;position:relative;overflow:hidden}
.fc:hover{border-color:#2563eb;transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,.08)}
.fc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.fc.cat-splicer::before{background:#2563eb}
.fc.cat-cleaver::before{background:#d97706}
.fc.cat-plier::before{background:#dc2626}
.fc.cat-env::before{background:#059669}
.fc.cat-other::before{background:#6366f1}
.fc .fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fc h3{color:#1e293b;font-size:15px;flex:1}
.fc .meta{display:flex;gap:6px;align-items:center}
.fc .badge{font-size:10px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.fc .b-freq-h{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.fc .b-freq-m{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.fc .b-freq-l{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
.fc .b-cat{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.fc .b-src{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.fc .row{margin-bottom:10px}
.fc .row:last-child{margin-bottom:0}
.fc .lb{color:#2563eb;font-size:11px;font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.fc .ct{color:#475569;font-size:13px;line-height:1.6;padding-left:8px;border-left:2px solid #dbeafe}
.fc .actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9}
.fc .act{font-size:11px;color:#64748b;cursor:pointer;padding:3px 10px;border-radius:4px;background:#f8fafc}
.fc .act:hover{color:#2563eb;background:#eff6ff}
.fc .act.danger:hover{color:#dc2626;background:#fef2f2}

/* 新增故障弹窗 */
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;width:90%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{color:#1e293b;font-size:20px;margin-bottom:16px}
.modal .fg{margin-bottom:14px}
.modal label{display:block;font-size:12px;color:#2563eb;margin-bottom:4px;font-weight:600}
.modal input,.modal select,.modal textarea{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;color:#1e293b;font-size:13px;outline:none;font-family:inherit}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#2563eb}
.modal textarea{min-height:70px;resize:vertical}
.modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal .btn{padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none}
.modal .btn-save{background:#2563eb;color:#fff}
.modal .btn-save:hover{background:#1d4ed8}
.modal .btn-cancel{background:#f1f5f9;color:#64748b}

/* 底部 */
.ft{text-align:center;margin-top:32px;padding:20px;border-top:1px solid #e2e8f0}
.ft p{color:#64748b;font-size:13px;line-height:1.8}
.ft .fs{color:#2563eb;font-size:12px;margin-top:6px}
.ft .sync{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#059669}
.ft .sync .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 空状态 */
.empty{text-align:center;padding:60px 20px;color:#64748b;font-size:14px}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .hd h1{font-size:20px}
  .stats{flex-direction:column}
  .toolbar{flex-direction:column}
  .search{width:100%}
}
</style>
</head>
<body>
<div class="wrap">

<div class="nav">
  <a href="sim-platform.html" class="back">&#8592; 返回平台</a>
  <span class="sp"></span>
  <button class="add-btn" onclick="openModal()">＋ 记录新故障</button>
</div>

<div class="hd">
  <h1>&#128295; 复杂故障记录平台</h1>
  <p>文字记录故障现象、原因与处理方法，持续积累故障知识点</p>
  <span class="tag">文字版 · 知识积累阶段</span>
</div>

<!-- 统计 -->
<div class="stats">
  <div class="stat"><div class="v" id="stTotal">0</div><div class="l">故障记录总数</div></div>
  <div class="stat"><div class="v" id="stFreq">0</div><div class="l">高频故障数</div></div>
  <div class="stat"><div class="v" id="stCat">0</div><div class="l">故障分类数</div></div>
  <div class="stat"><div class="v" id="stCustom">0</div><div class="l">师生提交数</div></div>
</div>

<!-- 搜索+筛选 -->
<div class="toolbar">
  <div class="search">
    <span class="si">&#128269;</span>
    <input type="text" id="searchInput" placeholder="搜索故障关键词..." oninput="render()">
  </div>
  <div class="filters" id="filters">
    <button class="fbtn on" onclick="setFilter('all',this)">全部</button>
    <button class="fbtn" onclick="setFilter('splicer',this)">熔接机</button>
    <button class="fbtn" onclick="setFilter('cleaver',this)">切割刀</button>
    <button class="fbtn" onclick="setFilter('plier',this)">米勒钳</button>
    <button class="fbtn" onclick="setFilter('env',this)">环境因素</button>
    <button class="fbtn" onclick="setFilter('other',this)">其他</button>
    <button class="fbtn" onclick="setFilter('custom',this)">师生提交</button>
  </div>
</div>

<!-- 故障卡片 -->
<div class="grid" id="grid"></div>

<div class="ft">
  <p>&#128203; 本平台记录的故障知识将持续积累，为后续3D场景复现和AI辅助诊断提供数据基础。</p>
  <p class="fs">&#9881; 故障记录将同步至飞书数据中心，形成可持续运营的故障知识库</p>
  <div class="sync"><span class="dot"></span> 飞书数据中枢已连通 · 自动同步中</div>
</div>
</div>

<!-- 新增故障弹窗 -->
<div class="modal-bg" id="modalBg">
<div class="modal">
  <h2>记录新故障</h2>
  <div class="fg">
    <label>故障名称 *</label>
    <input type="text" id="fTitle" placeholder="如：熔接机屏幕黑屏">
  </div>
  <div class="fg">
    <label>故障分类</label>
    <select id="fCat">
      <option value="splicer">熔接机</option>
      <option value="cleaver">切割刀</option>
      <option value="plier">米勒钳</option>
      <option value="env">环境因素</option>
      <option value="other">其他</option>
    </select>
  </div>
  <div class="fg">
    <label>发生频率</label>
    <select id="fFreq">
      <option value="h">高频（常见）</option>
      <option value="m">中频</option>
      <option value="l">低频（偶发）</option>
    </select>
  </div>
  <div class="fg">
    <label>故障现象 *</label>
    <textarea id="fSymptom" placeholder="描述故障的具体表现..."></textarea>
  </div>
  <div class="fg">
    <label>可能原因</label>
    <textarea id="fCause" placeholder="描述导致故障的原因..."></textarea>
  </div>
  <div class="fg">
    <label>处理方法 *</label>
    <textarea id="fFix" placeholder="描述解决故障的方法和步骤..."></textarea>
  </div>
  <div class="btns">
    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
    <button class="btn btn-save" onclick="saveFault()">保存记录</button>
  </div>
</div>
</div>

<script>
// ==================== 故障知识库 ====================
var BUILTIN_FAULTS = [
  {id:'b1',title:'光纤切割端面角度超标',cat:'cleaver',freq:'h',symptom:'熔接机报"切割角度过大"警告，熔接损耗偏高，屏幕显示端面斜切。',cause:'切割刀刀片磨损或缺口；光纤夹持位置偏移；切割力度不均匀；刀片高度未校准。',fix:'更换或翻转刀片至新刃口；调整刀片高度至标准位置；重新清洁光纤并切割，确保一刀成型。',src:'builtin'},
  {id:'b2',title:'光纤端面污染',cat:'env',freq:'h',symptom:'熔接机屏幕显示端面有异物点，熔接后出现气泡、裂纹或黑色烧结物。',cause:'切割后未及时放入熔接机；操作环境粉尘大；手指误触端面；无尘纸/酒精不足。',fix:'重新剥线切割；用无尘纸蘸取无水酒精沿一个方向擦拭端面；切割后立即放入熔接机，避免暴露超30秒。',src:'builtin'},
  {id:'b3',title:'电极老化放电异常',cat:'splicer',freq:'m',symptom:'放电电流不稳定，熔接损耗波动大，多次熔接失败，端面烧结不均。',cause:'电极使用次数超限（通常大于500次）；电极表面积碳或氧化；电极间距因振动变化。',fix:'用专用电极清洁刷清理电极表面；执行熔接机放电校准程序；电极超过使用极限时更换新电极对。',src:'builtin'},
  {id:'b4',title:'光纤对准偏差',cat:'splicer',freq:'h',symptom:'熔接机无法自动对准光纤，屏幕显示光纤明显偏移，X/Y轴偏差超限。',cause:'V型槽内有灰尘或碎纤；光纤夹具松动或磨损；两根光纤直径不一致。',fix:'用无尘纸蘸酒精清洁V型槽；检查光纤夹具压板是否到位；确保两根光纤型号一致。',src:'builtin'},
  {id:'b5',title:'热缩管加热不充分',cat:'splicer',freq:'m',symptom:'热缩管未完全收缩，内部残留气泡，保护强度不足，冷却后管壁松软。',cause:'加热时间不足（少于90秒）；加热器温度偏低；热缩管尺寸与光纤不匹配。',fix:'延长加热时间至90-120秒；检查加热器温度是否达标；选用与光纤直径匹配的热缩管（60mm标准型）。',src:'builtin'},
  {id:'b6',title:'裸纤过短夹持失败',cat:'plier',freq:'m',symptom:'光纤夹持不稳，熔接时发生位移，裸纤长度不足无法正常放电熔接。',cause:'剥线长度不够（少于50mm）；切割余量不足；夹具行程不到位。',fix:'确保剥线长度达到50mm以上（外皮+涂覆层分两次剥除）；切割保留12-16mm裸纤；检查夹具弹片张力。',src:'builtin'},
  {id:'b7',title:'涂覆层剥除损伤',cat:'plier',freq:'h',symptom:'剥线后玻璃纤表面有划痕或裂痕，熔接后损耗偏高或直接断纤。',cause:'米勒钳力度过大；来回拉锯式剥线；钳口有毛刺或残留碎屑。',fix:'分两次剥除（先外皮后涂覆层）；一次拉出禁止来回拉锯；定期检查清理钳口；力度均匀向左一次拉完。',src:'builtin'},
  {id:'b8',title:'放电参数不匹配',cat:'splicer',freq:'m',symptom:'熔接点过粗或过细，抗拉强度低，损耗值异常偏高（大于0.05dB）。',cause:'放电时间/电流未按光纤类型校准；光纤类型切换未更新程序；环境温湿度变化影响。',fix:'执行熔接机放电校准程序；根据光纤类型（SM/MM/DSF）选择对应熔接程序；温差大时增加校准频次。',src:'builtin'},
  {id:'b9',title:'切割刀刀片崩刃',cat:'cleaver',freq:'l',symptom:'切割面出现锯齿状边缘或斜切面不均匀，镜检发现端面有明显刻痕。',cause:'刀片使用过久刃口钝化；切割时光纤未放置到位；刀片受到撞击或跌落。',fix:'翻转刀片使用另一侧刃口（CT50可翻转多次）；更换全新刀片；确保光纤放置在橡胶垫正确位置。',src:'builtin'},
  {id:'b10',title:'光纤折断于V型槽',cat:'splicer',freq:'m',symptom:'光纤在V型槽处断裂，残段卡在槽内，后续光纤无法放置。',cause:'夹具关闭力度过大；光纤弯曲角度过大；V型槽内有残留碎纤。',fix:'用镊子小心取出碎纤；用压缩空气吹净V型槽；关闭夹具时力度适中，避免冲击。',src:'builtin'},
  {id:'b11',title:'熔接机电池续航不足',cat:'splicer',freq:'l',symptom:'野外作业时电量不足，熔接中断或无法启动，屏幕显示低电量警告。',cause:'电池未充满即外出作业；电池老化容量衰减；低温环境加速耗电。',fix:'出发前确认电池满电；携带备用电池；低温环境使用保温套；电池超2年建议更换。',src:'builtin'},
  {id:'b12',title:'光缆开剥伤及束管',cat:'other',freq:'m',symptom:'开剥光缆外护套时，内部束管被划伤或切断，导致光纤裸露受损。',cause:'开剥刀深度调节不当；用力过猛；未按光缆结构逐层开剥。',fix:'调节开剥刀至合适深度（仅切外护套）；逐层开剥，每层检查；使用专用光缆开剥工具。',src:'builtin'},
  {id:'b13',title:'酒精挥发浓度不足',cat:'env',freq:'l',symptom:'清洁光纤后端面仍有污渍，擦拭效果不明显，熔接损耗波动。',cause:'瓶装酒精长期开封挥发；使用工业酒精纯度不够；无尘纸反复使用已污染。',fix:'使用无水乙醇（纯度99%以上）；小瓶分装随用随取；每根光纤使用新无尘纸。',src:'builtin'},
  {id:'b14',title:'光纤识别错误混接',cat:'other',freq:'m',symptom:'熔接完成后OTDR测试发现某芯接错位置，光缆两端光纤序号不对应。',cause:'多芯光缆开剥后未编号；熔接时未核对两端序号；标识脱落或模糊。',fix:'开剥后立即用标签纸编号；熔接时逐芯核对序号；使用色环或数字标识双重确认。',src:'builtin'},
  {id:'b15',title:'热缩管内有灰尘',cat:'env',freq:'l',symptom:'加热后热缩管内可见黑点或白点，保护管透明度下降。',cause:'热缩管使用前未清洁；操作环境灰尘大；手套或手指污染管壁。',fix:'使用前用酒精棉擦拭热缩管内壁；穿防静电手套操作；环境灰尘大时使用防尘罩。',src:'builtin'},
  {id:'b16',title:'熔接点抗拉测试失败',cat:'splicer',freq:'h',symptom:'熔接完成后轻拉即断，抗拉强度远低于标准值（应大于5N）。',cause:'放电时间过短；光纤端面质量差；对准偏差导致熔接面小。',fix:'检查并重设放电参数；确保切割端面达标（角度<0.5°）；清洁V型槽后重新熔接。',src:'builtin'}
];

var CAT_NAMES={splicer:'熔接机',cleaver:'切割刀',plier:'米勒钳',env:'环境因素',other:'其他'};
var FREQ_NAMES={h:'高频',m:'中频',l:'低频'};

var currentFilter='all';

function loadCustom(){
  try{return JSON.parse(localStorage.getItem('fault_records')||'[]')}catch(e){return []}
}
function saveCustom(arr){
  try{localStorage.setItem('fault_records',JSON.stringify(arr))}catch(e){}
}
function getAllFaults(){
  var custom=loadCustom();
  return BUILTIN_FAULTS.concat(custom);
}

function render(){
  var keyword=document.getElementById('searchInput').value.trim().toLowerCase();
  var all=getAllFaults();
  
  var filtered=all.filter(function(f){
    if(currentFilter==='custom' && f.src!=='custom')return false;
    if(currentFilter!=='all' && currentFilter!=='custom' && f.cat!==currentFilter)return false;
    if(keyword){
      var txt=(f.title+f.symptom+f.cause+f.fix+CAT_NAMES[f.cat]+FREQ_NAMES[f.freq]).toLowerCase();
      if(txt.indexOf(keyword)<0)return false;
    }
    return true;
  });

  // 统计
  document.getElementById('stTotal').textContent=all.length;
  document.getElementById('stFreq').textContent=all.filter(function(f){return f.freq==='h'}).length;
  var cats={};all.forEach(function(f){cats[f.cat]=1});
  document.getElementById('stCat').textContent=Object.keys(cats).length;
  document.getElementById('stCustom').textContent=loadCustom().length;

  // 渲染卡片
  var box=document.getElementById('grid');
  if(!filtered.length){
    box.innerHTML='<div class="empty">未找到匹配的故障记录<br>试试清除筛选条件或记录一条新故障</div>';
    return;
  }
  var html='';
  filtered.forEach(function(f){
    var freqCls=f.freq==='h'?'b-freq-h':(f.freq==='m'?'b-freq-m':'b-freq-l');
    var srcBadge=f.src==='custom'?'<span class="badge b-src">师生提交</span>':'';
    var delBtn=f.src==='custom'?'<span class="act danger" onclick="delFault(\''+f.id+'\')">删除</span>':'';
    html+='<div class="fc cat-'+f.cat+'">'+
      '<div class="fh"><h3>'+f.title+'</h3><div class="meta">'+
        '<span class="badge '+freqCls+'">'+FREQ_NAMES[f.freq]+'</span>'+
        '<span class="badge b-cat">'+CAT_NAMES[f.cat]+'</span>'+
        srcBadge+
      '</div></div>'+
      '<div class="row"><div class="lb">现象</div><div class="ct">'+f.symptom+'</div></div>'+
      (f.cause?'<div class="row"><div class="lb">原因</div><div class="ct">'+f.cause+'</div></div>':'')+
      '<div class="row"><div class="lb">处理方法</div><div class="ct">'+f.fix+'</div></div>'+
      '<div class="actions"><span class="act" onclick="copyFault(\''+f.id+'\')">复制</span>'+delBtn+'</div>'+
    '</div>';
  });
  box.innerHTML=html;
}

function setFilter(cat,btn){
  currentFilter=cat;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  render();
}

function openModal(){
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('fTitle').focus();
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
  ['fTitle','fSymptom','fCause','fFix'].forEach(function(id){document.getElementById(id).value=''});
}
function saveFault(){
  var title=document.getElementById('fTitle').value.trim();
  var symptom=document.getElementById('fSymptom').value.trim();
  var fix=document.getElementById('fFix').value.trim();
  if(!title||!symptom||!fix){alert('请至少填写故障名称、现象和处理方法');return}
  var fault={
    id:'c'+Date.now(),
    title:title,
    cat:document.getElementById('fCat').value,
    freq:document.getElementById('fFreq').value,
    symptom:symptom,
    cause:document.getElementById('fCause').value.trim(),
    fix:fix,
    src:'custom',
    ts:Date.now()
  };
  var arr=loadCustom();
  arr.unshift(fault);
  saveCustom(arr);
  closeModal();
  render();
}
function delFault(id){
  if(!confirm('确认删除这条故障记录？'))return;
  var arr=loadCustom().filter(function(f){return f.id!==id});
  saveCustom(arr);
  render();
}
function copyFault(id){
  var f=getAllFaults().find(function(x){return x.id===id});
  if(!f)return;
  var text='【'+f.title+'】\n现象：'+f.symptom+'\n原因：'+(f.cause||'无')+'\n处理：'+f.fix;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板')});
  }else{
    alert('复制失败，请手动选择文字复制');
  }
}

// 初始化
render();
document.getElementById('modalBg').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});
</script>
</body>
